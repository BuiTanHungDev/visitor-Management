
spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: visitor-management
  devtools:
    restart:
      enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5432/visitor_management
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
  # mail:
  #   host: smtp.gmail.com
  #   port: 587
  #   username: ${MAIL_USERNAME}
  #   password: ${MAIL_PASSWORD}
  #   properties:
  #     mail:
  #       smtp:
  #         auth: true
  #         starttls:
  #           enable: true
server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-ms: 900000

  bootstrap:
    admin:
      password: ${ADMIN_INITIAL_PASSWORD:}

  otp:
    enabled: false
    hmac-secret: ${OTP_HMAC_SECRET:}
    email:
      enabled: false
      from: ${spring.mail.username:}
    sms:
      enabled: false